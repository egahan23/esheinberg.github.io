{{ $page := . }}
<nav class="site-nav" aria-label="Main">
  <div class="nav-inner">
    <a class="nav-brand" href="{{ site.Home.RelPermalink }}">{{ site.Params.author }}</a>
    <ul class="nav-links">
      {{ range site.Menus.main }}
        {{ if ne .Identifier "home" }}
        {{ $url := .URL | relURL }}
        <li><a href="{{ $url }}"{{ if eq $page.RelPermalink $url }} class="active" aria-current="page"{{ end }}{{ if eq .Identifier "cv" }} target="_blank" rel="noopener"{{ end }}>{{ .Name }}</a></li>
        {{ end }}
      {{ end }}
    </ul>
  </div>
</nav>
